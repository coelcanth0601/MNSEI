<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#173820">
<title>Test3</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #eef2ea;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
  }
  img { display: block; width: 100%; height: auto; max-height: 100dvh; object-fit: contain; }

  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  .site-watermark {
    position: fixed; left: 0; right: 0;
    bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex; justify-content: center;
    pointer-events: none;
    z-index: 900;
  }
  .site-watermark img {
    height: 26px; opacity: 0.88;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.4));
  }


  @keyframes ggPop {
    0% { transform: scale(0.9); opacity: 0; }
    60% { transform: scale(1.03); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes ggGrow {
    to { stroke-dashoffset: 0; }
  }
  .gg-banner {
    position: fixed; left: 0; right: 0;
    bottom: env(safe-area-inset-bottom);
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 950;
  }
  .gg-banner.gg-show { transform: translateY(0); }
  .gg-banner-inner {
    background: rgba(20,20,20,0.92);
    color: #fff; padding: 14px 16px;
    font-size: 14px; text-align: center;
    animation: ggPop 0.3s ease;
  }
  .gg-complete { background: linear-gradient(135deg, #256b34, #3d8b4c); }
  .gg-reward { font-size: 13px; opacity: 0.9; }
  .top-scrim {
    position: fixed; top: 0; left: 0; right: 0;
    height: calc(90px + env(safe-area-inset-top));
    background: linear-gradient(rgba(0,0,0,0.45), transparent);
    z-index: 930; pointer-events: none;
  }
  .top-btn {
    position: fixed; top: calc(16px + env(safe-area-inset-top));
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: #fff; font-size: 13px; font-weight: 500;
    text-decoration: none; border: none;
    min-height: 36px; padding: 0 16px;
    border-radius: 18px; z-index: 940;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .about-btn { right: 16px; }
  .close-btn { left: 16px; }
  .top-watermark {
    position: fixed; top: calc(16px + env(safe-area-inset-top));
    left: 0; right: 0;
    display: flex; justify-content: center;
    pointer-events: none; z-index: 935;
  }
  .top-watermark img {
    height: 28px; opacity: 0.95;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
  }
  .gg-close-overlay {
    position: fixed; inset: 0;
    background: #08170c;
    z-index: 990;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .gg-close-overlay.gg-active { opacity: 1; pointer-events: all; }
  .gg-vine-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .gg-vine-svg path {
    fill: none; stroke: #3d8b4c; stroke-width: 5; stroke-linecap: round;
    stroke-dasharray: 1000; stroke-dashoffset: 1000;
  }
  .gg-close-overlay.gg-active .gg-vine-svg path {
    animation: ggGrow 1.1s ease forwards;
  }
  .gg-vine-svg path:nth-child(2) { animation-delay: 0.15s !important; }
  .gg-vine-svg circle {
    fill: #6fbf73; opacity: 0;
    transition: opacity 0.4s ease;
  }
  .gg-close-overlay.gg-active .gg-vine-svg circle { opacity: 1; }
  .gg-close-msg {
    position: relative; z-index: 2;
    color: #eafbe9; font-size: 15px; text-align: center;
    opacity: 0; transition: opacity 0.4s ease 1.05s;
  }
  .gg-close-overlay.gg-active .gg-close-msg { opacity: 1; }

</style>
</head>
<body>
<img src="images/test3.jpeg" alt="Test3">
<div class="top-scrim"></div>
<button class="top-btn close-btn" id="gg-close-btn">Close</button>
<a class="top-btn about-btn" href="../about.html">About this project</a>
<div class="top-watermark"><img src="../logo.png" alt="logo"></div>
<div id="gg-close-overlay" class="gg-close-overlay">
<svg viewBox="0 0 400 800" class="gg-vine-svg" preserveAspectRatio="none">
<path d="M40,800 C90,650 10,520 70,380 C120,250 50,140 100,20"/>
<path d="M360,800 C310,640 390,500 320,360 C260,220 340,120 290,10"/>
<circle cx="70" cy="380" r="10"/>
<circle cx="100" cy="220" r="8"/>
<circle cx="320" cy="360" r="9"/>
<circle cx="290" cy="140" r="8"/>
</svg>
<div class="gg-close-msg">You can close this tab now</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../game.js"></script>
<script>
  window.addEventListener("load", function () {
    recordScan("test3", "Test3", 4);
    document.getElementById("gg-close-btn").addEventListener("click", ggCloseWithVines);
  });
</script>
</body>
</html>
